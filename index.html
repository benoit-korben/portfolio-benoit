<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Alex Tepito</h1>
      <div class="menu">
        <h2>A propos</h2>
        <h2>Contact</h2>
        <img src="images/logo-instagram-noir-png.webp" alt="instagram" class="logo">
      </div>
    </div>
    <div class="intro">
      <img src="images/mona_lisa.jpg" alt="Mona Lisa">
      <div class="description">
        <h2>Bonjour, -----------------</h2>
        <p>Je suis photographe et j’habite à Los Angeles. J’ai la chance de voyager aux quatre coins du monde et de photographier notre magnifique planète. </p>
        <img src="images/arrow_down.jpg" alt="down arrow">
      </div>
    </div>
    <div class="form">
      <form class="contact-form" action="#" method="post">
        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" placeholder="Votre nom" required>

        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" name="prenom" placeholder="Votre prénom" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Votre adresse email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Votre message..." required></textarea>

        <button type="submit">Envoyer</button>
      </form>
    </div>
  </div>
</body>
</html>
